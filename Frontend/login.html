<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 
<title>Login - My E-Commerce</title>

<link rel="stylesheet" href="css/style.css">
 

</head>

<body>

 
<main class="auth-page">

    <!-- Left Intro Section -->
    <section class="auth-intro">

        <div class="auth-brand">
            My E-Commerce
        </div>

        <div class="auth-intro-content">

            <p class="auth-small-title">
                WELCOME BACK
            </p>

            <h1>
                Shop smarter.<br>
                Live better.
            </h1>

            <p>
                Discover quality products and enjoy a simple,
                secure shopping experience.
            </p>

        </div>

    </section>


    <!-- Login Form Section -->
    <section class="auth-form-section">

        <div class="auth-form-card">

            <!-- Mobile Brand -->
            <div class="mobile-brand">
                My E-Commerce
            </div>

            <h2>
                Welcome back
            </h2>

            <p class="auth-subtitle">
                Login to continue shopping
            </p>


            <!-- Login Form -->
            <form id="login-form">

                <div class="input-group">

                    <label for="login-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="login-email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="login-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="login-password"
                        placeholder="Enter your password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Login
                </button>

            </form>


            <!-- Login Message -->
            <p
                id="login-message"
                class="auth-message"
                role="alert"
            ></p>


            <!-- Register Link -->
            <p class="auth-switch">

                Don't have an account?

                <a href="register.html">
                    Create an account
                </a>

            </p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>
 

</body>

</html>
