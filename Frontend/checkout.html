<!DOCTYPE html>

<html lang="en">

<head>

 
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>Checkout - My E-Commerce</title>

<link
    rel="stylesheet"
    href="css/style.css"
>
 

</head>

<body>

 
<!-- Header -->

<header class="header">

    <div class="logo">
        My E-Commerce
    </div>


    <nav>

        <a href="index.html">
            Home
        </a>

        <a href="cart.html">
            Cart 🛒
        </a>

        <a href="login.html">
            Login
        </a>

    </nav>

</header>


<!-- Checkout -->

<main class="checkout-page">


    <div class="checkout-container">


        <h1>
            Checkout
        </h1>


        <p class="checkout-subtitle">
            Review your order before placing it.
        </p>


        <!-- Order Items -->

        <div
            id="checkout-items"
            class="checkout-items"
        >

            <p>
                Loading order...
            </p>

        </div>


        <!-- Order Summary -->

        <div
            id="checkout-summary"
            class="checkout-summary"
        >

            <h2>
                Order Summary
            </h2>


            <p>
                Total:
                <strong id="checkout-total">
                    Rs. 0
                </strong>
            </p>


            <button
                id="place-order-button"
                class="place-order-button"
            >
                Place Order
            </button>


            <p
                id="checkout-message"
                class="checkout-message"
            ></p>

        </div>


    </div>


</main>


<script src="js/checkout.js"></script>
 

</body>

</html>
