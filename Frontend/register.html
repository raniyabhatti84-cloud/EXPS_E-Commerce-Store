<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

 
<title>Register - My E-Commerce</title>

<link rel="stylesheet" href="css/style.css">
 

</head>

<body>

 
<main class="auth-page">

    <!-- Left Intro Section -->
    <section class="auth-intro">

        <div class="auth-brand">
            My E-Commerce
        </div>

        <div class="auth-intro-content">

            <p class="auth-small-title">
                JOIN US
            </p>

            <h1>
                Start your<br>
                shopping journey.
            </h1>

            <p>
                Create your account and discover quality products
                with a simple and secure shopping experience.
            </p>

        </div>

    </section>


    <!-- Register Form Section -->
    <section class="auth-form-section">

        <div class="auth-form-card">

            <!-- Mobile Brand -->
            <div class="mobile-brand">
                My E-Commerce
            </div>

            <h2>
                Create account
            </h2>

            <p class="auth-subtitle">
                Register to start shopping
            </p>


            <!-- Register Form -->
            <form id="register-form">

                <div class="input-group">

                    <label for="register-name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="register-name"
                        placeholder="Enter your name"
                        autocomplete="name"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="register-email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="register-email"
                        placeholder="Enter your email"
                        autocomplete="email"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="register-password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="register-password"
                        placeholder="Create a password"
                        autocomplete="new-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="auth-button"
                >
                    Create Account
                </button>

            </form>


            <!-- Register Message -->
            <p
                id="register-message"
                class="auth-message"
                role="alert"
            ></p>


            <!-- Login Link -->
            <p class="auth-switch">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </section>

</main>


<script src="js/auth.js"></script>
 

</body>

</html>
